name: Build Expo APK

on:
  push:
    branches:
      - main # Triggers on pushes to the main branch
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm' # Change to 'yarn' if you use yarn

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17' # Expo SDK 50+ requires Java 17

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🚀 Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm install # Change to yarn install if you use yarn

      - name: 🛠️ Build APK
        run: eas build --platform android --profile preview --local --non-interactive --output=./app-release.apk

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessIN-APK
          path: ./app-release.apk
          retention-days: 7
